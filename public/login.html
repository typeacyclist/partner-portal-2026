<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In · Trendzact Partners</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/styles.css" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
<style>
  body { background: var(--bg-soft); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-shell {
    background: #fff;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 40px;
    max-width: 440px;
    width: 100%;
    box-shadow: var(--shadow-md);
  }
  .auth-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
  .auth-brand svg { width: 40px; height: 40px; }
  .auth-brand-name { font-family: var(--ff-display); font-weight: 500; font-size: 22px; color: var(--dark-gray); line-height: 1; }
  .auth-brand-sub { font-family: var(--ff-mono); font-size: 10px; letter-spacing: 0.14em; color: var(--dark-green); text-transform: uppercase; margin-top: 2px; display: block; }
  .auth-h1 { font-family: var(--ff-display); font-size: 28px; font-weight: 500; margin: 0 0 6px; letter-spacing: -0.01em; }
  .auth-sub { color: var(--med-gray); font-size: 14px; margin-bottom: 28px; }
  .auth-msg { padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 18px; display: none; }
  .auth-msg.error { background: #FEF2F2; border: 1px solid #FCA5A5; color: #991B1B; display: block; }
  .auth-msg.info { background: var(--tint-light); border: 1px solid var(--med-green); color: var(--dark-green); display: block; }
  .auth-forgot { text-align: right; margin-top: -6px; margin-bottom: 18px; }
  .auth-forgot a { font-size: 13px; color: var(--med-gray); text-decoration: none; }
  .auth-forgot a:hover { color: var(--dark-green); }
  .auth-footer { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border-soft); font-size: 12px; color: var(--med-gray); text-align: center; }
  .auth-divider { display: flex; align-items: center; gap: 12px; margin: 22px 0 18px; color: var(--med-gray); font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; }
  .auth-divider::before, .auth-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .auth-divider span { font-family: var(--ff-mono); }
</style>
</head>
<body>

<main class="auth-shell">
  <div class="auth-brand">
    <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="2" width="36" height="36" rx="8" fill="#00827C"/>
      <path d="M11 14h18M20 14v15" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="28" cy="24" r="3" fill="#00A398" stroke="#fff" stroke-width="1.5"/>
    </svg>
    <div>
      <div class="auth-brand-name">Trendzact</div>
      <span class="auth-brand-sub">Partners</span>
    </div>
  </div>

  <h1 class="auth-h1">Sign in</h1>
  <p class="auth-sub">Enter your email and password to access the Partners Portal.</p>

  <div id="authMsg" class="auth-msg"></div>

  <form id="loginForm">
    <div class="form-field" style="margin-bottom: 14px;">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required />
    </div>
    <div class="form-field" style="margin-bottom: 6px;">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />
    </div>
    <div class="auth-forgot">
      <a href="#" id="forgotLink">Forgot password?</a>
    </div>
    <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Sign in</button>
  </form>

  <div class="auth-divider">
    <span>or</span>
  </div>

  <button type="button" id="magicLinkBtn" class="btn btn-ghost" style="width: 100%;">
    Email me a sign-in link
  </button>

  <div class="auth-footer">
    Access is by Trendzact invitation only. Contact your Trendzact representative to request an account.
  </div>
</main>

<script src="/assets/firebase-config.js"></script>
<script type="module" src="/assets/auth.js"></script>
<script type="module">
  import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

  const msg = document.getElementById('authMsg');
  const show = (type, text) => {
    msg.className = 'auth-msg ' + type;
    msg.textContent = text;
  };
  const clear = () => { msg.className = 'auth-msg'; msg.textContent = ''; };

  // If already signed in, skip the login page
  const params = new URLSearchParams(window.location.search);
  let redirectTo = params.get('redirect') || '/';
  // Don't let a bad redirect param send us back to login (loop guard)
  if (/\/login/i.test(redirectTo) || /\/set-password/i.test(redirectTo)) {
    redirectTo = '/';
  }

  // If arriving from a completed password reset, show a success banner
  if (params.get('reset') === 'success') {
    show('info', 'Password changed. Sign in with your new password.');
    // Clean the URL so a refresh doesn't keep showing the banner
    const cleanUrl = window.location.pathname + (redirectTo !== '/' ? '?redirect=' + encodeURIComponent(redirectTo) : '');
    window.history.replaceState({}, '', cleanUrl);
  }
  const waitForAuth = setInterval(() => {
    if (!window.TrendzactAuth) return;
    clearInterval(waitForAuth);
    onAuthStateChanged(window.TrendzactAuth.auth, (user) => {
      if (user) window.location.href = redirectTo;
    });
  }, 50);

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    clear();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) return;

    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    try {
      await window.TrendzactAuth.signIn(email, password);
      // auth.js will handle redirect based on mustResetPassword flag
      show('info', 'Signed in — redirecting…');
      // Fallback in case Firestore doc lookup lags
      setTimeout(() => { window.location.href = redirectTo; }, 1500);
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Sign in';
      const friendly = {
        'auth/invalid-credential': 'Invalid email or password.',
        'auth/user-not-found': 'No account with that email.',
        'auth/wrong-password': 'Incorrect password.',
        'auth/too-many-requests': 'Too many failed attempts — please try again in a few minutes.',
        'auth/network-request-failed': 'Network error. Check your connection.',
        'auth/user-disabled': 'This account has been disabled. Contact Trendzact.'
      }[err.code] || 'Sign in failed: ' + (err.message || err.code);
      show('error', friendly);
    }
  });

  document.getElementById('forgotLink').addEventListener('click', async (e) => {
    e.preventDefault();
    clear();
    const email = document.getElementById('email').value.trim();
    if (!email) {
      show('error', 'Enter your email first, then click "Forgot password?"');
      document.getElementById('email').focus();
      return;
    }
    try {
      await window.TrendzactAuth.sendResetEmail(email);
      show('info', 'If an account exists for ' + email + ', a password reset email is on the way.');
    } catch (err) {
      // Don't reveal whether the email exists — show generic success anyway
      show('info', 'If an account exists for ' + email + ', a password reset email is on the way.');
    }
  });

  document.getElementById('magicLinkBtn').addEventListener('click', async () => {
    clear();
    const email = document.getElementById('email').value.trim();
    if (!email) {
      show('error', 'Enter your email first, then click "Email me a sign-in link".');
      document.getElementById('email').focus();
      return;
    }
    const btn = document.getElementById('magicLinkBtn');
    btn.disabled = true;
    btn.textContent = 'Sending…';
    try {
      await window.TrendzactAuth.sendMagicLink(email);
      show('info', 'Check your inbox — a sign-in link has been sent to ' + email + '. Click it from this same device to complete sign-in.');
      btn.textContent = 'Email me a sign-in link';
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Email me a sign-in link';
      const friendly = {
        'auth/invalid-email': 'That email address looks invalid.',
        'auth/missing-email': 'Enter an email address first.',
        'auth/quota-exceeded': 'Email send limit reached. Try again in an hour or use password sign-in.',
        'auth/unauthorized-continue-uri': 'This domain is not authorized for email links. Contact Trendzact.'
      }[err.code] || ('Could not send sign-in link: ' + (err.message || err.code));
      show('error', friendly);
    }
  });
</script>
</body>
</html>
