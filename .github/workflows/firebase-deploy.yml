name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Preview deploy for PRs (ephemeral preview channel, auto-expires)
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'trendzact-partners' }}
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
      - name: Show Node/npm versions
        run: node --version && npm --version
      - name: Install function dependencies
        run: cd functions && npm ci
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Authenticate to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          SA_PATH="${RUNNER_TEMP}/firebase-sa.json"
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT}" > "${SA_PATH}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${SA_PATH}" >> "${GITHUB_ENV}"
      - name: Inject PORTAL_SHARED_SECRET into portal-config.js
        env:
          PORTAL_SHARED_SECRET: ${{ secrets.PORTAL_SHARED_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${PORTAL_SHARED_SECRET:-}" ]; then
            echo "::error::PORTAL_SHARED_SECRET repo secret is not set. Add it at: https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const p = "public/assets/portal-config.js";
            const placeholder = "REPLACE_ME_WITH_GENERATED_SECRET";
            const secret = process.env.PORTAL_SHARED_SECRET;
            let content = fs.readFileSync(p, "utf8");
            if (!content.includes(placeholder)) {
              console.error("ERROR: " + p + " does not contain the placeholder. Refusing to deploy (secret may have been committed).");
              process.exit(1);
            }
            content = content.replace(placeholder, secret);
            fs.writeFileSync(p, content);
            console.log("Secret injected into " + p);
          '
      - name: Deploy preview
        run: firebase hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" --expires 7d --project "${FIREBASE_PROJECT_ID}" --non-interactive

  # Production deploy on merge to main
  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'trendzact-partners' }}
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
      - name: Show Node/npm versions
        run: node --version && npm --version
      - name: Install function dependencies
        run: cd functions && npm ci
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Authenticate to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          SA_PATH="${RUNNER_TEMP}/firebase-sa.json"
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT}" > "${SA_PATH}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${SA_PATH}" >> "${GITHUB_ENV}"
      - name: Inject PORTAL_SHARED_SECRET into portal-config.js
        env:
          PORTAL_SHARED_SECRET: ${{ secrets.PORTAL_SHARED_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${PORTAL_SHARED_SECRET:-}" ]; then
            echo "::error::PORTAL_SHARED_SECRET repo secret is not set. Add it at: https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const p = "public/assets/portal-config.js";
            const placeholder = "REPLACE_ME_WITH_GENERATED_SECRET";
            const secret = process.env.PORTAL_SHARED_SECRET;
            let content = fs.readFileSync(p, "utf8");
            if (!content.includes(placeholder)) {
              console.error("ERROR: " + p + " does not contain the placeholder. Refusing to deploy (secret may have been committed).");
              process.exit(1);
            }
            content = content.replace(placeholder, secret);
            fs.writeFileSync(p, content);
            console.log("Secret injected into " + p);
          '
      - name: Deploy to Firebase (hosting + functions)
        run: firebase deploy --only hosting,functions --project "${FIREBASE_PROJECT_ID}" --non-interactive
