name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Preview deploy for PRs (ephemeral preview channel, auto-expires)
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'trendzact-partners' }}
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
      - name: Show Node/npm versions
        run: node --version && npm --version
      - name: Install function dependencies
        run: cd functions && npm ci
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Authenticate to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          SA_PATH="${RUNNER_TEMP}/firebase-sa.json"
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT}" > "${SA_PATH}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${SA_PATH}" >> "${GITHUB_ENV}"
      - name: Deploy preview
        run: firebase hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" --expires 7d --project "${FIREBASE_PROJECT_ID}" --non-interactive

  # Production deploy on merge to main
  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'trendzact-partners' }}
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
      - name: Show Node/npm versions
        run: node --version && npm --version
      - name: Install function dependencies
        run: cd functions && npm ci
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Authenticate to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          SA_PATH="${RUNNER_TEMP}/firebase-sa.json"
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT}" > "${SA_PATH}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${SA_PATH}" >> "${GITHUB_ENV}"
      - name: Deploy to Firebase
        run: firebase deploy --only hosting --project "${FIREBASE_PROJECT_ID}" --non-interactive
