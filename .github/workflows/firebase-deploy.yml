name: Deploy to Firebase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Preview deploy for PRs (hosting only — functions don't preview)
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json
      - name: Install function dependencies
        run: cd functions && npm ci
      - name: Deploy preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          expires: 7d

  # Production deploy on merge to main (hosting + functions)
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json
      - name: Install function dependencies
        run: cd functions && npm ci
      - name: Inject PORTAL_SHARED_SECRET into portal config
        env:
          PORTAL_SHARED_SECRET: ${{ secrets.PORTAL_SHARED_SECRET }}
        run: |
          node -e "const fs=require('fs');const file='public/assets/portal-config.js';const placeholder='REPLACE_ME_WITH_GENERATED_SECRET';const secret=process.env.PORTAL_SHARED_SECRET;if(!secret){throw new Error('Missing PORTAL_SHARED_SECRET secret');}const content=fs.readFileSync(file,'utf8');if(!content.includes(placeholder)){throw new Error('Placeholder secret not found in portal-config.js');}fs.writeFileSync(file,content.replace(placeholder,secret));"
      - name: Authenticate to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy to Firebase (hosting + functions)
        run: firebase deploy --only hosting,functions --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive
      - name: Cleanup credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
